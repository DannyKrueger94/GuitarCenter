<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GuitarCenter</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#15110e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GuitarCenter">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
        @font-face { font-family: 'Bricolage Grotesque'; src: url('vendor/font/BricolageGrotesque.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
        html, body { margin: 0; background: radial-gradient(ellipse 80% 40% at 50% -8%, rgba(249, 115, 22, 0.16), transparent 70%), #15110e; color: #fff4e6; font-family: 'Bricolage Grotesque', -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif; }
        #blocco { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
        #blocco[hidden] { display: none; }
        #blocco form { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
        #blocco img { width: 88px; height: 88px; margin: 0 auto 6px; }
        #blocco h1 { margin: 0 0 4px; font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; }
        #blocco p { margin: 0; color: #c9b8a4; }
        #blocco input { width: 100%; box-sizing: border-box; font: 600 1rem/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.03em; text-align: center; padding: 16px 10px; border-radius: 16px; border: 1px solid #3a2f27; background: #1f1915; color: inherit; }
        #blocco input::placeholder { color: #8a7a6a; }
        #blocco input:focus { outline: none; border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25); }
        #blocco button { padding: 16px; border: 0; border-radius: 16px; font-family: inherit; background: linear-gradient(135deg, #fbbf24, #f97316); color: #1a1206; font-size: 1rem; font-weight: 700; }
        #blocco button:disabled { opacity: 0.6; }
        #blocco .aiuto { font-size: 0.85rem; }
        #errore { color: #f87171; min-height: 1.4em; }
    </style>
    <script type="module" src="avvio.js"></script>
</head>
<body>
    <!-- Schermata del codice: l'app vera è cifrata e compare solo sui dispositivi attivati -->
    <section id="blocco" hidden>
        <form id="attiva">
            <img src="icons/icon-192x192.png" alt="">
            <h1>GuitarCenter</h1>
            <p>Inserisci il codice di attivazione di questo dispositivo.</p>
            <input id="codice" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX" maxlength="40" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Codice di attivazione" required>
            <button id="attivaBtn" type="submit">Attiva</button>
            <p id="errore" role="alert"></p>
            <p class="aiuto">Il codice è in <code>strumenti\codice-attivazione.txt</code> sul PC. Puoi incollarlo: i trattini si mettono da soli.</p>
        </form>
    </section>
</body>
</html>
